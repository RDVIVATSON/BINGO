<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BINGO Card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #0d0d1a;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .page-wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .page-header { text-align: center; padding-top: 8px; }
    #cardLogoSvg { width: min(240px, 65vw); }
    #cardLogoImg { max-height: 60px; max-width: 70%; object-fit: contain; display: none; }

    .sort-bar {
      text-align: center;
      font-size: 11px;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
      min-height: 16px;
    }

    .card-wrap {
      background: #12122a;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #1e1e3a;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }

    .card-wrap.best-card {
      border-color: #e94560;
      box-shadow: 0 6px 24px rgba(233,69,96,0.3);
    }

    .card-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0d0d1a;
      font-size: 12px;
      color: #555;
      letter-spacing: 1px;
    }

    .card-label .card-num { font-weight: bold; color: #888; }
    .card-label .card-score { color: #e94560; font-weight: bold; font-size: 11px; }

    .card-header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .card-header-cell {
      padding: 8px 4px;
      text-align: center;
      font-size: clamp(18px, 5.5vw, 28px);
      font-weight: 900;
      letter-spacing: 2px;
    }

    .card-header-cell.col-B { background: #1565C0; }
    .card-header-cell.col-I { background: #C62828; }
    .card-header-cell.col-N { background: #555; }
    .card-header-cell.col-G { background: #2E7D32; }
    .card-header-cell.col-O { background: #E65100; }

    .card-body {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      background: #1e1e3a;
      padding: 3px;
    }

    .card-cell {
      background: #12122a;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(13px, 4vw, 22px);
      font-weight: bold;
      border-radius: 5px;
      transition: background 0.25s, transform 0.2s;
      color: #bbb;
      position: relative;
    }

    .card-cell.daubed {
      background: #e94560;
      color: #fff;
      transform: scale(0.94);
    }

    .card-cell.daubed::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 5px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.25), transparent 60%);
      pointer-events: none;
    }

    .card-cell.needs-daub {
      outline: 2px solid rgba(233,69,96,0.55);
      color: #fff;
    }

    .card-cell.free-space {
      background: #27ae60;
      color: #fff;
      font-size: clamp(7px, 2.2vw, 12px);
      letter-spacing: 0.5px;
      text-align: center;
      transform: scale(0.94);
    }

    .card-footer {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d0d1a;
      font-size: 12px;
      color: #555;
    }

    .card-footer span { color: #888; }
    .card-footer span b { color: #e94560; }

    .last-called-bar {
      text-align: center;
      font-size: clamp(12px, 3vw, 16px);
      color: #555;
      letter-spacing: 1px;
      padding: 4px 0;
    }

    .last-called-bar strong {
      color: #fff;
      font-size: clamp(16px, 4.5vw, 24px);
      font-weight: 900;
    }

    #waitingScreen {
      position: fixed;
      inset: 0;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      text-align: center;
      padding: 24px;
    }

    #waitLogoSvg { width: min(260px, 70vw); }
    #waitLogoImg { max-width: 70vw; max-height: 100px; object-fit: contain; display: none; }
    #waitingScreen p { color: #555; font-size: clamp(11px, 3vw, 15px); letter-spacing: 3px; text-transform: uppercase; }

    #winOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }

    #winOverlay.show { display: flex; }

    #winOverlay h1 {
      font-size: clamp(52px, 16vw, 100px);
      font-weight: 900;
      color: #e94560;
      letter-spacing: 8px;
      animation: popIn 0.4s ease;
    }

    #winCardNum { font-size: clamp(14px, 3.5vw, 20px); color: #aaa; letter-spacing: 2px; }
    #winOverlay p { color: #888; font-size: clamp(12px, 2.5vw, 16px); letter-spacing: 2px; margin-top: 4px; }
    #winOverlay button {
      margin-top: 12px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    @keyframes popIn {
      0%   { transform: scale(0.4); opacity: 0; }
      80%  { transform: scale(1.1); }
      100% { transform: scale(1);   opacity: 1; }
    }

    @keyframes daub-pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.18); }
      100% { transform: scale(0.94); }
    }

    .daub-animate { animation: daub-pop 0.3s ease; }

    /* Setup screen */
    #setupScreen {
      position: fixed;
      inset: 0;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 150;
      padding: 32px 24px;
      text-align: center;
    }

    #setupScreen svg { width: min(240px, 65vw); }
    #setupScreen img.setup-logo { max-width: 65vw; max-height: 80px; object-fit: contain; display: none; }

    .setup-card {
      background: #16213e;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #1e3a6e;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setup-card h2 {
      font-size: 1rem;
      color: #e94560;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .setup-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .setup-field label {
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .setup-field input,
    .setup-field select {
      background: #0f3460;
      color: #fff;
      border: 1px solid #1e3a6e;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 16px;
      width: 100%;
    }

    .setup-field input::placeholder { color: #555; }

    .setup-field .pack-controls {
      display: flex;
      align-items: center;
      gap: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1e3a6e;
    }

    .pack-controls button {
      background: #0f3460;
      color: #fff;
      border: none;
      width: 48px;
      height: 44px;
      font-size: 22px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .pack-controls button:hover { background: #e94560; }

    .pack-controls span {
      flex: 1;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      background: #0a0a1a;
      height: 44px;
      line-height: 44px;
    }

    .setup-desc {
      font-size: 11px;
      color: #555;
      text-align: left;
      margin-top: -8px;
    }

    .setup-btn {
      background: #e94560;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    .setup-btn:hover { background: #c73652; }
  </style>
</head>
<body>

<!-- Setup screen — shown on first load -->
<div id="setupScreen">
  <svg id="setupLogoSvg" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="120" rx="14" fill="#1a1a2e"/>
    <text x="150" y="52" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#e94560" text-anchor="middle" letter-spacing="4">BINGO</text>
    <text x="150" y="90" font-family="Arial, sans-serif" font-size="18" fill="#aaa" text-anchor="middle" letter-spacing="6">NIGHT</text>
  </svg>
  <img class="setup-logo" id="setupLogoImg" src="" alt="">

  <div class="setup-card">
    <h2>Get Your Cards</h2>

    <div class="setup-field">
      <label>Your Name (optional)</label>
      <input type="text" id="playerName" placeholder="Enter your name..." maxlength="30" autocomplete="off">
    </div>

    <div class="setup-field">
      <label>Number of Packs</label>
      <div class="pack-controls">
        <button id="packMinus">−</button>
        <span id="packCount">1</span>
        <button id="packPlus">+</button>
      </div>
      <div class="setup-desc" id="packDesc">3 cards per pack — 3 cards total</div>
    </div>

    <button class="setup-btn" id="startBtn">Get My Cards</button>
  </div>
</div>

<div id="waitingScreen" style="display:none;">
  <svg id="waitLogoSvg" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="120" rx="14" fill="#1a1a2e"/>
    <text x="150" y="52" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#e94560" text-anchor="middle" letter-spacing="4">BINGO</text>
    <text x="150" y="90" font-family="Arial, sans-serif" font-size="18" fill="#aaa" text-anchor="middle" letter-spacing="6">NIGHT</text>
  </svg>
  <img id="waitLogoImg" src="" alt="">
  <p>Waiting for game to start...</p>
</div>

<div id="winOverlay">
  <h1>BINGO!</h1>
  <div id="winCardNum"></div>
  <p>Show this screen to the caller</p>
  <button onclick="document.getElementById('winOverlay').classList.remove('show')">Dismiss</button>
</div>

<div class="page-wrap" id="pageWrap" style="display:none;">
  <div class="page-header">
    <svg id="cardLogoSvg" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="120" rx="14" fill="#1a1a2e"/>
      <text x="150" y="52" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#e94560" text-anchor="middle" letter-spacing="4">BINGO</text>
      <text x="150" y="90" font-family="Arial, sans-serif" font-size="18" fill="#aaa" text-anchor="middle" letter-spacing="6">NIGHT</text>
    </svg>
    <img id="cardLogoImg" src="" alt="">
  </div>

  <div class="last-called-bar" id="lastCalledBar">Waiting for first ball...</div>
  <div class="sort-bar" id="sortBar"></div>
  <div id="cardsContainer"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
import { getDatabase, ref, onValue, push, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDDG_V9d2hd7QxHaAuAVoQ2RsnjB3omB-M",
  authDomain: "bingo-night-c2a1a.firebaseapp.com",
  databaseURL: "https://bingo-night-c2a1a-default-rtdb.firebaseio.com",
  projectId: "bingo-night-c2a1a",
  storageBucket: "bingo-night-c2a1a.firebasestorage.app",
  messagingSenderId: "118563477693",
  appId: "1:118563477693:web:2fe869d3472f20da6a3fd4"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// Standard win lines used as fallback for unmapped patterns
const STANDARD_LINES = [
  [[0,0],[0,1],[0,2],[0,3],[0,4]],
  [[1,0],[1,1],[1,2],[1,3],[1,4]],
  [[2,0],[2,1],[2,2],[2,3],[2,4]],
  [[3,0],[3,1],[3,2],[3,3],[3,4]],
  [[4,0],[4,1],[4,2],[4,3],[4,4]],
  [[0,0],[1,0],[2,0],[3,0],[4,0]],
  [[0,1],[1,1],[2,1],[3,1],[4,1]],
  [[0,2],[1,2],[2,2],[3,2],[4,2]],
  [[0,3],[1,3],[2,3],[3,3],[4,3]],
  [[0,4],[1,4],[2,4],[3,4],[4,4]],
  [[0,0],[1,1],[2,2],[3,3],[4,4]],
  [[0,4],[1,3],[2,2],[3,1],[4,0]],
];

// Pattern map — each entry is an array of winning lines.
// Multiple lines = any one of them completes the win.
// Single line with all cells = entire shape must be complete.
const PATTERN_MAP = {

  // Regular bingo (any standard line) or four corners — either wins
  regular4c: [
    ...STANDARD_LINES,
    [[0,0],[0,4],[4,0],[4,4]], // four corners
  ],

  fourcorners: [
    [[0,0],[0,4],[4,0],[4,4]],
  ],

  blackout: [
    [[0,0],[0,1],[0,2],[0,3],[0,4],
     [1,0],[1,1],[1,2],[1,3],[1,4],
     [2,0],[2,1],[2,2],[2,3],[2,4],
     [3,0],[3,1],[3,2],[3,3],[3,4],
     [4,0],[4,1],[4,2],[4,3],[4,4]],
  ],

  halfmoon: [
    [[0,3],
     [1,3],[1,4],
     [2,2],[2,3],[2,4],
     [3,0],[3,1],[3,2],[3,3],[3,4],
     [4,1],[4,2],[4,3]],
  ],

  musicnote: [
    [[0,2],[0,3],
     [1,2],[1,4],
     [2,1],[2,2],
     [3,0],[3,1],[3,2],
     [4,1]],
  ],
};

function getWinLines(patternName) {
  return PATTERN_MAP[patternName] || STANDARD_LINES;
}

// Card generation
const RANGES = { B:[1,15], I:[16,30], N:[31,45], G:[46,60], O:[61,75] };
const COLS   = ['B','I','N','G','O'];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateCard() {
  const card = {};
  COLS.forEach((col, ci) => {
    const [lo, hi] = RANGES[col];
    const pool = [];
    for (let n = lo; n <= hi; n++) pool.push(n);
    shuffle(pool);
    card[col] = pool.slice(0, 5);
    if (ci === 2) card[col][2] = 'FREE';
  });
  return card;
}

// Get pack size from config
let packSizePerPack = 3;
try {
  const cfg = JSON.parse(localStorage.getItem('bingoConfig') || '{}');
  packSizePerPack = parseInt(cfg.packsize) || 3;
} catch {}

// Apply venue logo to all screens
function applyLogo() {
  try {
    const cfg = JSON.parse(localStorage.getItem('bingoConfig') || '{}');
    if (cfg.logo) {
      ['cardLogoImg','waitLogoImg','setupLogoImg'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.src = cfg.logo; el.style.display = 'block'; }
      });
      ['cardLogoSvg','waitLogoSvg','setupLogoSvg'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    }
  } catch {}
}
applyLogo();

// Load saved player name
const savedName = localStorage.getItem('bingoPlayerName') || '';
const nameInput = document.getElementById('playerName');
if (nameInput && savedName) nameInput.value = savedName;

// Pack count controls
let numPacks = 1;
const packCountEl = document.getElementById('packCount');
const packDescEl  = document.getElementById('packDesc');

function updatePackDesc() {
  const total = numPacks * packSizePerPack;
  packDescEl.textContent = `${packSizePerPack} cards per pack — ${total} card${total !== 1 ? 's' : ''} total`;
}
updatePackDesc();

document.getElementById('packMinus').addEventListener('click', () => {
  if (numPacks > 1) { numPacks--; packCountEl.textContent = numPacks; updatePackDesc(); }
});

document.getElementById('packPlus').addEventListener('click', () => {
  numPacks++;
  packCountEl.textContent = numPacks;
  updatePackDesc();
});

// Cards array — populated when player hits start
let cards = [];
let playerName = '';
const container = document.getElementById('cardsContainer');

document.getElementById('startBtn').addEventListener('click', () => {
  playerName = (document.getElementById('playerName').value || '').trim();
  if (playerName) localStorage.setItem('bingoPlayerName', playerName);

  const totalCards = numPacks * packSizePerPack;
  const sessionBase = Date.now();
  cards = Array.from({ length: totalCards }, (_, i) => ({
    cardNumber: sessionBase + i,
    index: i,
    data: generateCard(),
  }));

  container.innerHTML = '';
  cards.forEach(c => container.appendChild(renderCard(c.data, c.cardNumber, c.index)));

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('waitingScreen').style.display = 'flex';

  startFirebaseListener();
});

// Render a card
function renderCard(cardData, cardNumber, index) {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.id = `card-${cardNumber}`;
  wrap.dataset.cardNumber = cardNumber;

  wrap.innerHTML = `
    <div class="card-label">
      <span class="card-num">Card #${index + 1}</span>
      <span class="card-score" id="score-${cardNumber}"></span>
    </div>
    <div class="card-header">
      <div class="card-header-cell col-B">B</div>
      <div class="card-header-cell col-I">I</div>
      <div class="card-header-cell col-N">N</div>
      <div class="card-header-cell col-G">G</div>
      <div class="card-header-cell col-O">O</div>
    </div>
    <div class="card-body" id="body-${cardNumber}"></div>
    <div class="card-footer"><span>Daubed: <b id="daub-${cardNumber}">0</b></span></div>
  `;

  const body = wrap.querySelector(`#body-${cardNumber}`);
  for (let row = 0; row < 5; row++) {
    COLS.forEach(col => {
      const val = cardData[col][row];
      const isFree = val === 'FREE';
      const cell = document.createElement('div');
      cell.className = 'card-cell' + (isFree ? ' free-space daubed' : '');
      cell.textContent = isFree ? 'FREE' : val;
      if (!isFree) { cell.dataset.col = col; cell.dataset.num = String(val); }
      body.appendChild(cell);
    });
  }

  return wrap;
}

// Cards built dynamically after player hits start button

// Get best line score for a card against current pattern
function getBestLineScore(cardEl, patternName) {
  const cells = cardEl.querySelectorAll('.card-cell');
  const lines = getWinLines(patternName);
  let best = 0;
  lines.forEach(line => {
    const count = line.filter(([r, c]) => cells[r * 5 + c]?.classList.contains('daubed')).length;
    if (count > best) best = count;
  });
  return best;
}

// Get best line cells for highlighting
function getBestLine(cardEl, patternName) {
  const cells = cardEl.querySelectorAll('.card-cell');
  const lines = getWinLines(patternName);
  let best = -1, bestLine = null;
  lines.forEach(line => {
    const count = line.filter(([r, c]) => cells[r * 5 + c]?.classList.contains('daubed')).length;
    if (count > best) { best = count; bestLine = line; }
  });
  return bestLine;
}

// Check win against current pattern
function checkWin(cardEl, patternName) {
  const cells = cardEl.querySelectorAll('.card-cell');
  const lines = getWinLines(patternName);
  return lines.some(line => line.every(([r, c]) => cells[r * 5 + c]?.classList.contains('daubed')));
}

// Sort cards by score
function sortCards(patternName) {
  const scored = cards.map(c => ({
    ...c,
    el: document.getElementById(`card-${c.cardNumber}`),
    score: getBestLineScore(document.getElementById(`card-${c.cardNumber}`), patternName)
  })).sort((a, b) => b.score - a.score);

  scored.forEach((s, i) => {
    container.appendChild(s.el);
    s.el.classList.toggle('best-card', i === 0);
    const scoreEl = document.getElementById(`score-${s.cardNumber}`);
    if (scoreEl) scoreEl.textContent = s.score > 0 ? `${s.score} toward BINGO` : '';
  });

  const sortBar = document.getElementById('sortBar');
  sortBar.textContent = scored[0].score > 0
    ? `Best card: ${scored[0].score}/5 to BINGO`
    : '';
}

// Apply venue logo
// (handled by applyLogo() called earlier)

let winShown = new Set();
let lastTimestamp = null;
let currentPattern = 'regular4c';

function startFirebaseListener() {
  onValue(ref(db, 'bingoState'), snapshot => {
    const state = snapshot.val();

    if (!state || !state.calledNumbers || state.calledNumbers.length === 0) {
      document.getElementById('waitingScreen').style.display = 'flex';
      document.getElementById('pageWrap').style.display = 'none';
      document.querySelectorAll('.card-cell:not(.free-space)').forEach(c => {
        c.classList.remove('daubed', 'daub-animate', 'needs-daub');
      });
      winShown.clear();
      lastTimestamp = null;
      return;
    }

    document.getElementById('waitingScreen').style.display = 'none';
    document.getElementById('pageWrap').style.display = 'flex';

    // Detect reset
    if (lastTimestamp !== null && state.timestamp < lastTimestamp) {
      document.querySelectorAll('.card-cell:not(.free-space)').forEach(c => {
        c.classList.remove('daubed', 'daub-animate', 'needs-daub');
      });
      winShown.clear();
    }
    lastTimestamp = state.timestamp;
    currentPattern = state.pattern || 'regular4c';

    // Daub called numbers on all cards
    state.calledNumbers.forEach(({ column, number }) => {
      const num = String(number);
      document.querySelectorAll(`.card-cell[data-col="${column}"][data-num="${num}"]`).forEach(cell => {
        if (!cell.classList.contains('daubed')) {
          cell.classList.add('daubed', 'daub-animate');
          setTimeout(() => cell.classList.remove('daub-animate'), 300);
        }
      });
    });

    // Update daub counts and best-line highlights
    cards.forEach(c => {
      const cardEl = document.getElementById(`card-${c.cardNumber}`);
      if (!cardEl) return;

      const daubed = cardEl.querySelectorAll('.card-cell.daubed').length;
      const daubEl = document.getElementById(`daub-${c.cardNumber}`);
      if (daubEl) daubEl.textContent = daubed;

      cardEl.querySelectorAll('.card-cell').forEach(cell => cell.classList.remove('needs-daub'));
      const bestLine = getBestLine(cardEl, currentPattern);
      if (bestLine) {
        const cells = cardEl.querySelectorAll('.card-cell');
        bestLine.forEach(([r, cv]) => {
          const cell = cells[r * 5 + cv];
          if (cell && !cell.classList.contains('daubed')) cell.classList.add('needs-daub');
        });
      }
    });

    // Update last called
    if (state.lastCalled) {
      const { column, number } = state.lastCalled;
      document.getElementById('lastCalledBar').innerHTML = `Last called: <strong>${column}${number}</strong>`;
    }

    // Sort
    sortCards(currentPattern);

    // Check wins
    cards.forEach(c => {
      if (winShown.has(c.cardNumber)) return;
      const cardEl = document.getElementById(`card-${c.cardNumber}`);
      if (!cardEl) return;
      if (checkWin(cardEl, currentPattern)) {
        winShown.add(c.cardNumber);
        push(ref(db, 'bingoClaims'), {
          cardNumber: c.index + 1,
          playerName: playerName || null,
          timestamp: serverTimestamp()
        });
        const label = playerName ? `${playerName} — Card #${c.index + 1}` : `Card #${c.index + 1}`;
        document.getElementById('winCardNum').textContent = label;
        setTimeout(() => document.getElementById('winOverlay').classList.add('show'), 300);
      }
    });
  });
}
</script>
</body>
</html>
