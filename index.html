	<script>
	// Apply saved config on load
	(function applyConfig() {
	  let cfg = {};
	  try { cfg = JSON.parse(localStorage.getItem('bingoConfig')) || {}; } catch {}

	  // Logo
	  const logoEl = document.getElementById('venueLogo');
	  if (logoEl) {
	    if (cfg.showlogo === false) {
	      logoEl.closest('.static-section').style.display = 'none';
	    } else if (cfg.logo) {
	      logoEl.src = cfg.logo;
	    } else {
	      const svg = `<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
	        <rect width="300" height="120" rx="14" fill="#1a1a2e"/>
	        <text x="150" y="52" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#e94560" text-anchor="middle" letter-spacing="4">BINGO</text>
	        <text x="150" y="90" font-family="Arial, sans-serif" font-size="18" fill="#aaa" text-anchor="middle" letter-spacing="6">NIGHT</text>
	      </svg>`;
	      logoEl.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
	    }
	  }

	  // QR button visibility
	  const qrBtn = document.getElementById('qrBtn');
	  if (qrBtn && cfg.qr === false) qrBtn.style.display = 'none';

	  // Wildcard toggle
	  const wcToggle = document.getElementById('enableWildcard');
	  const wcWrap = document.querySelector('.wildcard-toggle');
	  if (cfg.wildcard === false) {
	    if (wcWrap) wcWrap.style.display = 'none';
	    if (wcToggle) wcToggle.checked = false;
	  } else {
	    if (wcToggle) wcToggle.checked = true;
	  }

	  // Ball counter visibility
	  const counter = document.getElementById('ballCounter');
	  if (counter && cfg.counter === false) counter.style.display = 'none';

	  // Last ball visibility
	  const lastBall = document.querySelector('.last-number');
	  if (lastBall && cfg.lastball === false) lastBall.style.display = 'none';

	  // Pattern dropdown — filter to selected only
	  if (cfg.patterns && cfg.patterns.length > 0) {
	    const select = document.getElementById('patterns');
	    if (select) {
	      [...select.options].forEach(opt => {
	        if (!cfg.patterns.includes(opt.value)) opt.remove();
	      });
	    }
	  }
	})();
	</script>

<script>
// Speed bingo toggle logic
(function() {
  const speedToggle = document.getElementById('enableSpeedBingo');
  const qrBtn       = document.getElementById('qrBtn');
  const jackpotSec  = document.getElementById('jackpotSection');

  function applySpeedBingo(isSpeed) {
    // Hide QR button in speed mode
    if (qrBtn) qrBtn.style.display = isSpeed ? 'none' : '';
    // Show jackpot only in standard mode when blackout is selected
    updateJackpotVisibility();
  }

  function updateJackpotVisibility() {
    const isSpeed = speedToggle && speedToggle.checked;
    if (jackpotSec) jackpotSec.style.display = isSpeed ? 'none' : 'block';
  }

  if (speedToggle) {
    speedToggle.addEventListener('change', () => applySpeedBingo(speedToggle.checked));
  }

  // Sync jackpot to Firebase state when caller types
  const jackpotInput = document.getElementById('jackpotAmount');
  const winnersInput = document.getElementById('winnersCount');
  const payoutDisplay = document.getElementById('payoutDisplay');

  function updatePayout() {
    const jackpot = parseFloat(jackpotInput ? jackpotInput.value : 0) || 0;
    const winners = parseInt(winnersInput ? winnersInput.value : 1) || 1;
    if (payoutDisplay) {
      payoutDisplay.textContent = jackpot > 0
        ? `Payout per winner: $${(jackpot / winners).toFixed(2)}`
        : '';
    }
  }

  function syncJackpotToFirebase() {
    try {
      const raw = localStorage.getItem('bingoState');
      const state = raw ? JSON.parse(raw) : null;
      if (state) {
        state.jackpot = parseFloat(jackpotInput ? jackpotInput.value : 0) || 0;
        localStorage.setItem('bingoState', JSON.stringify(state));
        if (window._fbSet && window._fbRef && window._db) {
          window._fbSet(window._fbRef(window._db, 'bingoState'), state);
        }
      }
    } catch(e) {}
  }

  if (jackpotInput) {
    jackpotInput.addEventListener('input', () => { updatePayout(); syncJackpotToFirebase(); });
  }
  if (winnersInput) {
    winnersInput.addEventListener('input', updatePayout);
  }

  // Initial state
  applySpeedBingo(speedToggle ? speedToggle.checked : false);
})();
</script>

<script type="module">
  import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm';

  const baseURL = window.location.origin + window.location.pathname.replace('index.html', '') + 'card.html';

  let qrPacks = 1;

  function getPackSize() {
    try { return parseInt(JSON.parse(localStorage.getItem('bingoConfig') || '{}').packsize) || 3; } catch { return 3; }
  }

  function updateQrDesc() {
    const ps = getPackSize();
    const total = qrPacks * ps;
    document.getElementById('qrPackDesc').textContent = `${ps} cards per pack — ${total} card${total !== 1 ? 's' : ''} total`;
  }

  document.getElementById('qrPackMinus').addEventListener('click', () => {
    if (qrPacks > 1) { qrPacks--; document.getElementById('qrPackCount').textContent = qrPacks; updateQrDesc(); }
  });

  document.getElementById('qrPackPlus').addEventListener('click', () => {
    qrPacks++;
    document.getElementById('qrPackCount').textContent = qrPacks;
    updateQrDesc();
  });

  document.getElementById('qrGenerateBtn').addEventListener('click', () => {
    // Get current sessionId from localStorage state
    let sessionId = '';
    try {
      const state = JSON.parse(localStorage.getItem('bingoState') || '{}');
      sessionId = state.sessionId || '';
    } catch(e) {}

    const url = `${baseURL}?packs=${qrPacks}${sessionId ? '&session=' + sessionId : ''}`;
    const container = document.getElementById('qrCodeContainer');
    container.innerHTML = '';
    QRCode.toCanvas(document.createElement('canvas'), url, { width: 220, margin: 1 }, (err, canvas) => {
      if (!err) container.appendChild(canvas);
    });
    const ps = getPackSize();
    document.getElementById('qrPackLabel').textContent = `${qrPacks} pack${qrPacks !== 1 ? 's' : ''} — ${qrPacks * ps} cards`;
    document.getElementById('qrSetup').style.display = 'none';
    document.getElementById('qrDisplay').style.display = 'block';
  });

  document.getElementById('qrBackBtn').addEventListener('click', () => {
    document.getElementById('qrSetup').style.display = 'block';
    document.getElementById('qrDisplay').style.display = 'none';
  });

  document.getElementById('qrBtn').addEventListener('click', () => {
    const modal = document.getElementById('qrModal');
    // Reset to setup view
    document.getElementById('qrSetup').style.display = 'block';
    document.getElementById('qrDisplay').style.display = 'none';
    qrPacks = 1;
    document.getElementById('qrPackCount').textContent = 1;
    updateQrDesc();
    modal.style.display = 'flex';
  });

  document.getElementById('qrModal').addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
  });
</script>
